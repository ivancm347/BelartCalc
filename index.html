/* --- Melhorias de responsividade para celular --- */
@media (max-width: 600px){
  .ficha-grade{grid-template-columns:1fr 1fr;gap:10px}
  .seg{flex-wrap:wrap}
  .seg-btn{flex:1 1 45%;min-width:70px;font-size:12px;padding:8px 4px;white-space:normal;line-height:1.2}
  .ficha-topo{flex-wrap:wrap;gap:8px}
  .ficha-nome{flex:1 1 100%;min-width:0}
  .secao-cab{flex-direction:column;align-items:stretch !important}
  .secao-cab .bc-pdf-btn{margin-left:0 !important;margin-top:8px;align-self:flex-start}
  .mat-linha{grid-template-columns:1fr;gap:6px;padding:12px}
  .mat-nome{grid-column:1}
  .orc-acoes{flex-direction:column;align-items:stretch}
  .orc-acoes .btn{width:100%;justify-content:center}
  .paper{padding:16px}
  .bc-projeto .entrada{font-size:16px}
}
@media (max-width: 380px){
  .ficha-grade{grid-template-columns:1fr;gap:10px}
  .seg-btn{flex:1 1 100%}
}
/* --- Orçamento - responsividade completa --- */
@media (max-width: 960px){
  .orc-layout{grid-template-columns:1fr !important}
  .orc-painel{order:1}
  .paper{order:2}
}
@media (max-width: 600px){
  .orc-painel{padding:14px}
  .orc-grade.duas{grid-template-columns:1fr;gap:10px}
  .paper{padding:16px 12px;font-size:13px;border-radius:0;margin:0 -12px;border-left:0;border-right:0}
  .paper-timbre{flex-direction:column;align-items:flex-start;gap:10px}
  .paper-doc{text-align:left}
  .paper-cliente{grid-template-columns:1fr;gap:8px}
  .paper-cliente div{font-size:13px;word-break:break-word}
  .paper-totais{max-width:100%;margin-left:0}
  .paper-tabela{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .paper-tabela table{min-width:480px}
  .paper-assin{grid-template-columns:1fr;gap:20px}
  .paper-obs{font-size:12px}
  .campo .entrada{font-size:16px}
}
@media (max-width: 380px){
  .paper{padding:12px 10px}
  .paper-marca h2{font-size:17px}
  .orc-linha{flex-direction:column;align-items:flex-start;gap:2px}
  .orc-linha.total{flex-direction:row;align-items:baseline}
}

function bcLogoJpeg(cb){

      it=d.items[i];
      if(it.grupo!==g){ g=it.grupo; api.ensure(30); api.nl(6); api.text(g, api.ML, api.getY(), 12, true); api.nl(16);
        api.line(api.ML, api.W-api.MR, api.getY()+6, 0.75, 0.8); }
      api.ensure(16);
      var y=api.getY();
      var nome=it.nome+(it.un?" ("+it.un+")":"");
      if(api.estW(nome,10) > 250) nome=nome.slice(0,52)+"\u2026";
      api.text(nome, api.ML, y, 10, false);
      api.text(it.qtd, 330, y, 10, false);
      api.text(it.preco, 420, y, 10, false);
      var tot=it.total, tw=api.estW(tot,10);
      api.text(tot, api.W-api.MR-tw, y, 10, true);
      api.nl(15);
    }
    api.nl(8);
    api.line(api.ML, api.W-api.MR, api.getY()+8, 0.5, 1.0); api.nl(16);
    var tg="Total de materiais: "+d.totalGeral, tw2=api.estW(tg,12);
    api.text(tg, api.W-api.MR-tw2, api.getY(), 12, true);
  });
  savePdf(u8, "lista-materiais-"+dataArq()+".pdf");
}
function pdfOrcamento(){
  var d=scrapeBudget();
  if(!d){ alert("Abra a aba Or\u00e7amento com o modo Pro ativo para gerar o PDF."); return; }
  var proj=bcGetProjeto();
  bcLogoJpeg(function(logo){
    var u8=buildPdf(function(api){
      var y, i;
      var topY=api.getY(), nomeX=api.ML;
      if(logo){
        var sc=Math.min(1, 86/logo.w, 40/logo.h), dw=logo.w*sc, dh=logo.h*sc;
        api.ensure(dh+10);
        topY=api.getY();
        api.image(logo.bytes, logo.w, logo.h, api.ML, topY-dh, dw, dh);
        nomeX=api.ML+dw+12;
        api.text(d.empresa||"Sua empresa", nomeX, topY-15, 17, true);
        api.setY(topY-Math.max(dh,22)-4);
      } else {
        api.text(d.empresa||"Sua empresa", api.ML, topY, 17, true); api.nl(20);
      }
      api.text(d.docTipo||"OR\u00c7AMENTO", api.ML, api.getY(), 12, true); api.nl(15);
      if(d.docNum){ y=api.para(d.docNum, api.ML, api.getY(), 10, false, api.W-api.ML-api.MR, 13); api.setY(y-4); }
      if(proj){ api.ensure(16); api.text("Projeto/Obra: "+proj, api.ML, api.getY(), 11, true); api.nl(16); }
      api.nl(6); api.line(api.ML, api.W-api.MR, api.getY()+8, 0.5, 1.0); api.nl(16);
      var ck=Object.keys(d.cliente);
      if(ck.length){ api.text("Cliente", api.ML, api.getY(), 12, true); api.nl(16);
        ck.forEach(function(k){ api.ensure(14); api.text(k+": "+d.cliente[k], api.ML, api.getY(), 10, false); api.nl(14); });
        api.nl(6); }
      function tabela(titulo, head, rows, widths, numCols){
        if(!rows.length) return;
        var ri, ci, cell, maxw, tx, num;
        api.ensure(40); api.nl(4);
        api.text(titulo, api.ML, api.getY(), 12, true); api.nl(17);
        api.ensure(15);
        for(ci=0;ci<head.length;ci++) api.text(head[ci], api.ML+widths[ci], api.getY(), 9, true);
        api.nl(13); api.line(api.ML, api.W-api.MR, api.getY()+5, 0.75, 0.8); api.nl(4);
        for(ri=0;ri<rows.length;ri++){
          var r=rows[ri]; api.ensure(14);
          var yy=api.getY(), last=(ri===rows.length-1);
          for(ci=0;ci<head.length&&ci<r.length;ci++){
            cell=r[ci];
            maxw=((ci+1<head.length)?widths[ci+1]:api.W-api.MR)-widths[ci]-8;
            if(api.estW(cell,9)>maxw) cell=cell.slice(0,Math.max(4,Math.floor(maxw/(9*0.52))))+"\u2026";
            num=(numCols.indexOf(ci)>=0);
            tx=api.ML+widths[ci];
            if(num){ tx=((ci+1<head.length)?api.ML+widths[ci+1]:api.W-api.MR)-api.estW(cell,9); }
            api.text(cell, tx, yy, 9, last);
          }
          api.nl(13);
        }
        api.nl(6);
      }
      if(d.servicos.length) tabela("Servi\u00e7os", ["Servi\u00e7o","\u00c1rea (m\u00b2)"], d.servicos.map(function(x){ return [x[0], x[2]||""]; }), [0, 400], [1]);
      if(d.materiais.length) tabela("Materiais", ["Material","Qtd.","Un.","Pre\u00e7o","Total"], d.materiais, [0, 290, 340, 380, 450], [1,3,4]);
      if(d.valores.length){
        api.ensure(40); api.nl(4); api.text("Valores", api.ML, api.getY(), 12, true); api.nl(17);
        d.valores.forEach(function(x, idx){
          api.ensure(14); var yy2=api.getY(), last2=idx===d.valores.length-1;
          var lab=x[0]||"", val=x[1]||"";
          api.text(lab, api.ML, yy2, last2?11:10, last2);
          var vw=api.estW(val, last2?11:10);
          api.text(val, api.W-api.MR-vw, yy2, last2?11:10, last2);
          api.nl(last2?16:14);
        });
        api.nl(4);
      }
      if(d.obs){ api.ensure(30); api.text("Observa\u00e7\u00f5es", api.ML, api.getY(), 12, true); api.nl(16);
        y=api.para(d.obs, api.ML, api.getY(), 10, false, api.W-api.ML-api.MR, 13); api.setY(y-6); api.nl(6); }
      api.nl(10);
      api.text((d.empresa||"Sua empresa")+" \u2014 respons\u00e1vel t\u00e9cnico", api.ML, api.getY(), 10, false); api.nl(22);
      api.text("Cliente \u2014 aceite", api.ML, api.getY(), 10, false); api.nl(22);
      if(d.rodape){ y=api.para(d.rodape, api.ML, api.getY(), 8, false, api.W-api.ML-api.MR, 11); api.setY(y); }
    });
    savePdf(u8, "orcamento-"+dataArq()+".pdf");
  });
}
/* ===== Injeção de UI ===== */
var BCSVG='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/></svg>';
function bcAddBtn(box, fn){
  if(!box || box.querySelector(":scope > .bc-pdf-btn")) return;
  var b=document.createElement("button");
  b.type="button"; b.className="btn btn-fantasma bc-pdf-btn";
  b.innerHTML=BCSVG+"<span>Baixar PDF</span>";
  b.style.marginLeft="8px";
  b.addEventListener("click", fn);
  box.appendChild(b);
}
function bcProjetoField(){
  if(document.getElementById("bc-projeto-input")) return;
  var hs=document.querySelectorAll("h2.secao-titulo"), i;
  for(i=0;i<hs.length;i++){
    if(hs[i].textContent.trim()==="Servi\u00e7os"){
      var cab=hs[i].closest(".secao-cab");
      if(!cab) return;
      var wrap=document.createElement("div");
      wrap.className="campo bc-projeto";
      wrap.style.margin="4px 0 16px";
      var lab=document.createElement("label");
      lab.className="campo-rotulo"; lab.setAttribute("for","bc-projeto-input");
      lab.textContent="Nome do projeto / obra";
      var inp=document.createElement("input");
      inp.id="bc-projeto-input"; inp.className="entrada"; inp.maxLength=80;
      inp.placeholder="Ex: Reforma apto 302 \u2014 Ed. Atl\u00e2ntico";
      inp.autocomplete="off";
      try{ inp.value=localStorage.getItem("belartcalc-projeto")||""; }catch(e){}
      inp.addEventListener("input", function(){ try{ localStorage.setItem("belartcalc-projeto", inp.value); }catch(e){} });
      wrap.appendChild(lab); wrap.appendChild(inp);
      cab.parentNode.insertBefore(wrap, cab.nextSibling);
      return;
    }
  }
}
function bcScan(){
  try{
    bcProjetoField();
    var hs=document.querySelectorAll("h2.secao-titulo"), i, j;
    for(i=0;i<hs.length;i++){
      if(hs[i].textContent.trim()==="Lista de materiais" && !hs[i].dataset.bcPdf){
        hs[i].dataset.bcPdf="1";
        var cab=hs[i].closest(".secao-cab")||hs[i].parentElement;
        if(cab){ cab.style.display="flex"; cab.style.alignItems="center"; cab.style.justifyContent="space-between"; cab.style.gap="8px"; }
        bcAddBtn(cab, pdfMateriais);
      }
    }
    var az=document.querySelectorAll(".orc-acoes");
    for(j=0;j<az.length;j++){
      if(!az[j].dataset.bcPdf){ az[j].dataset.bcPdf="1"; az[j].style.display="flex"; az[j].style.gap="8px"; az[j].style.flexWrap="wrap"; bcAddBtn(az[j], pdfOrcamento); }
    }
  }catch(e){}
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", bcScan);
bcScan();
new MutationObserver(bcScan).observe(document.documentElement,{childList:true,subtree:true});
})();


</script>
